<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">LiveFlow</title>
  <desc id="desc">Three colored comment flow lines behind a white LF monogram</desc>
  <defs>
    <linearGradient id="cyanTrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.58" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="magentaTrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3D9E"/>
      <stop offset="0.58" stop-color="#FF3D9E"/>
      <stop offset="1" stop-color="#FF3D9E" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="yellowTrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD600"/>
      <stop offset="0.58" stop-color="#FFD600"/>
      <stop offset="1" stop-color="#FFD600" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect x="3" y="3" width="122" height="122" rx="27" fill="#0B1220"/>
  <rect x="3.75" y="3.75" width="120.5" height="120.5" rx="26.25" fill="none" stroke="#1B3048" stroke-width="1.5"/>

  <!-- Bright rounded leading edges on the left, with short trails behind them to the right. -->
  <rect x="14" y="31" width="70" height="11" rx="5.5" fill="url(#cyanTrail)"/>
  <rect x="10" y="53" width="72" height="11" rx="5.5" fill="url(#magentaTrail)"/>
  <rect x="16" y="75" width="66" height="11" rx="5.5" fill="url(#yellowTrail)"/>

  <!-- Custom, font-independent, forward-leaning LF monogram. -->
  <path fill="#FFFFFF" d="M65 24H82L69 85H91L87.5 102H48.5Z"/>
  <path fill="#FFFFFF" d="M88 38H121L117.5 54H101L98.5 66H115L111.5 82H95L90.5 104H73.5Z"/>
</svg>
