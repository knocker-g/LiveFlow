<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveFlow PoC</title>
    <style>
        body {
            margin: 0;
            padding: 12px;
            width: 320px;
            font-family: Arial, sans-serif;
            background: #121212;
            color: #eaeaea;
        }

        h3 {
            margin: 0 0 12px;
            font-size: 16px;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            min-height: 80px;
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1f1f1f;
            color: #f5f5f5;
            padding: 8px;
        }

        button {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .row {
            margin-top: 10px;
        }

        .status {
            font-size: 12px;
            color: #cbd5e1;
            margin-top: 8px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <h3>LiveFlow PoC</h3>
    <textarea id="messageInput">Test message</textarea>
    <button id="sendBtn">Send test message</button>
    <div class="row">
        <button id="authBtn">Google OAuth Login</button>
    </div>
    <div id="status" class="status">Idle</div>
    <script src="src/popup.js"></script>
</body>

</html>
